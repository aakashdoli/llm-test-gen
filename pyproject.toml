[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-test-gen"
version = "0.1.0"
description = "Generate pytest skeleton tests for Python projects using LLMs, with optional Streamlit UI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aakash Doli" }]
license = { text = "MIT" }

dependencies = [
  "click>=8.1.7",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0"
]
ui = [
  "streamlit>=1.31.0"
]

[project.scripts]
llm-testgen = "llm_testgen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]